<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>W4 練習 Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header>
      <div class="header-info">
        <div class="avatar">🤖</div>
        <div class="header-text">
          <h1>練習用 Chatbot</h1>
          <!-- 練習一：把標題改成你們組的名字 -->
          <p class="subtitle">
            <span class="status-dot"></span>
            W4 Git Branch 練習 · 線上
          </p>
        </div>
      </div>
      <button class="dark-toggle" onclick="document.body.classList.toggle('dark')">🌙 深色</button>
    </header>

    <div id="chat-box">
      <div class="message-wrapper bot">
        <div class="msg-avatar">🤖</div>
        <div class="message bot">
          嗨！我是練習用的 Chatbot，今天我們要學 Git Branch 🌿
        </div>
      </div>
    </div>

    <div class="input-area">
      <input id="user-input" type="text" placeholder="輸入訊息…按 Enter 送出">
      <!-- 練習二：把按鈕換成你喜歡的 emoji 或文字 -->
      <button class="send-btn" onclick="sendMessage()" title="送出">➤</button>
    </div>
  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById('user-input');
      const chatBox = document.getElementById('chat-box');
      const text = input.value.trim();

      if (!text) return;

      // 顯示使用者訊息
      appendMessage('user', '🧑', text);
      input.value = '';

      // 顯示打字中動畫
      const typingId = showTyping(chatBox);

      // 模擬 bot 回覆（延遲感更真實）
      setTimeout(() => {
        removeTyping(typingId, chatBox);
        appendMessage('bot', '🤖', `你說了「${text}」，我收到了！`);
      }, 900);
    }

    function appendMessage(role, avatarEmoji, text) {
      const chatBox = document.getElementById('chat-box');
      const wrapper = document.createElement('div');
      wrapper.className = `message-wrapper ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.textContent = avatarEmoji;

      const bubble = document.createElement('div');
      bubble.className = `message ${role}`;
      bubble.textContent = text;

      wrapper.appendChild(avatar);
      wrapper.appendChild(bubble);
      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showTyping(chatBox) {
      const id = 'typing-' + Date.now();
      const wrapper = document.createElement('div');
      wrapper.className = 'message-wrapper bot';
      wrapper.id = id;

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.textContent = '🤖';

      const indicator = document.createElement('div');
      indicator.className = 'typing-indicator';
      indicator.innerHTML = '<span></span><span></span><span></span>';

      wrapper.appendChild(avatar);
      wrapper.appendChild(indicator);
      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
      return id;
    }

    function removeTyping(id, chatBox) {
      const el = document.getElementById(id);
      if (el) chatBox.removeChild(el);
    }

    // 按 Enter 送出
    document.getElementById('user-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') sendMessage();
    });
  </script>

</body>
</html>
